name: diagnose-pane-mutant

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixed-pane-comparison:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Require D storage
        shell: pwsh
        run: |
          if (-not (Test-Path -LiteralPath 'D:/') -or -not $env:GITHUB_WORKSPACE.StartsWith('D:\', [StringComparison]::OrdinalIgnoreCase)) {
            throw 'This diagnostic requires D storage; no fallback is permitted.'
          }

      - name: Check out diagnostic control
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Install fixed source SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.404

      - name: Compare one mutant with 31 exact test IDs
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/mutation-diagnostics/Invoke-PaneMutantComparison.ps1

      - name: Preserve comparison evidence including raw exit 2
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pane-mutant-comparison-${{ github.run_id }}-${{ github.run_attempt }}
          path: D:/NeNeCommander/evidence/issue-439/ci-${{ github.run_id }}-${{ github.run_attempt }}/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
