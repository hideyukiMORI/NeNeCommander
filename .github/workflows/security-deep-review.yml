name: security-deep-review

on:
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  adversarial-review:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.401

      - name: Read project stage
        id: project-state
        shell: pwsh
        run: |
          $state = Get-Content -LiteralPath './docs/PROJECT_STATE.md' -Raw
          $isImplementation = $state -match '(?m)^- Stage: `implementation`\s*$'
          "implementation=$($isImplementation.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Initialize CodeQL
        if: steps.project-state.outputs.implementation == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: csharp
          build-mode: none
          queries: security-and-quality
          config-file: ./.github/codeql/codeql-config.yml

      - name: Run deep review
        shell: pwsh
        run: pwsh -NoProfile -File ./eng/deep-review.ps1 -ReportPath ./artifacts/security/deep-review.json

      - name: Analyze with CodeQL
        if: always() && steps.project-state.outputs.implementation == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:csharp

      - name: Preserve review evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-deep-review
          path: artifacts/security/
          if-no-files-found: error
          retention-days: 30
