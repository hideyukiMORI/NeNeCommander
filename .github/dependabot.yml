version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
      time: '04:23'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      github-actions:
        patterns:
          - '*'

  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: daily
      time: '04:41'
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      nuget-production:
        dependency-type: production
        patterns:
          - '*'
      nuget-development:
        dependency-type: development
        patterns:
          - '*'
